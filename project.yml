# XcodeGen spec. Generate the project with:  xcodegen generate
# Then open KITT.xcodeproj, pick your team, and run on the paired Series 5.
#
# To change the offline model: edit scripts/versions.env, then the four marked lines below.
# The watch app does not bundle the model (watch apps are limited to 75 MB); it downloads
# the pinned file from More › Offline model and checks its SHA-256 before using it.
name: KITT
options:
  bundleIdPrefix: com.palvaran.kitt
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "NWV5APGHL5"   # IDEASQUANTIFIED LLC (as chosen in Xcode › Signing)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # llama.xcframework's simulator slice is arm64 only (Apple silicon Macs). Release builds
    # every architecture, so without this the simulator build also tries x86_64 and fails to link.
    "EXCLUDED_ARCHS[sdk=watchsimulator*]": x86_64

packages:
  KITTCore:
    path: Packages/KITTCore
  KITTEngine:                     # brings llama.xcframework with it (scripts/build-llama.sh)
    path: Packages/KITTEngine

targets:
  KITTWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Apps/Shared
      - path: Apps/KITTWatch
    dependencies:
      - package: KITTCore
      - package: KITTEngine
        product: KITTEngine
    info:
      path: Apps/KITTWatch/Info.plist
      properties:
        CFBundleDisplayName: KITT
        WKApplication: true
        # Runs without the iPhone app. The iPhone app (KITTPhone) only carries it to the watch,
        # because installing straight from Xcode to a Series 5 over Wi-Fi proved unreliable.
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: com.palvaran.kitt
        # The offline model the watch downloads. scripts/check-model-manifest.sh fails the
        # build if these differ from scripts/versions.env.
        KITTModelFile: SmolLM2-135M-Instruct-Q4_0.gguf                                       # MODEL_FILE
        KITTModelSHA256: bcc3af2849ad6095af57e9b5cd43775256efdc66e306acb529172f92d0c04b03   # MODEL_SHA256
        KITTModelBytes: 91893088                                                             # MODEL_BYTES
        KITTModelURL: https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/09816acd5d99df7be770d85ea30822623dab342c/SmolLM2-135M-Instruct-Q4_0.gguf   # MODEL_URL
        # The guide voice packs, each an optional download. scripts/build-voice-packs.sh --update
        # writes these; the same pre-build check compares them with scripts/versions.env.
        KITTVoiceHeartFile: kitt-voice-heart-v1.kvoice                                       # VOICE_HEART_FILE
        KITTVoiceHeartSHA256: 6991c4137dc641e68cb652b4ffce546719dc6ce62b619173840cf62962ed1e33   # VOICE_HEART_SHA256
        KITTVoiceHeartBytes: 17978201                                                             # VOICE_HEART_BYTES
        KITTVoiceHeartURL: https://github.com/Palvaran/KITTWatch/releases/download/voices-v1/kitt-voice-heart-v1.kvoice   # VOICE_HEART_URL
        KITTVoiceMichaelFile: kitt-voice-michael-v1.kvoice                                   # VOICE_MICHAEL_FILE
        KITTVoiceMichaelSHA256: abfb16f0a480eb5d1794ba0050da4c85ed65b2eb3963b79250a4e1b8280175f4   # VOICE_MICHAEL_SHA256
        KITTVoiceMichaelBytes: 19846337                                                           # VOICE_MICHAEL_BYTES
        KITTVoiceMichaelURL: https://github.com/Palvaran/KITTWatch/releases/download/voices-v1/kitt-voice-michael-v1.kvoice   # VOICE_MICHAEL_URL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.palvaran.kitt.watch
        PRODUCT_NAME: KITT
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        DEAD_CODE_STRIPPING: YES
      configs:
        Debug:
          # Debug Swift is far slower; measure with Release (Product › Scheme › Edit › Run › Release).
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    preBuildScripts:
      - name: Check download manifests
        script: |
          "$SRCROOT/scripts/check-model-manifest.sh"
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Stamp build time and commit
        script: |
          "$SRCROOT/scripts/stamp-build.sh"
        basedOnDependencyAnalysis: false

  KITTPhone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Apps/Shared
      - path: Apps/KITTPhone
      - path: Apps/KITTWatch/VoiceSamples
        includes:
          - "Kokoro-*"
        buildPhase: resources
    dependencies:
      - target: KITTWatch          # embedded under Watch/; the iPhone installs it on the watch
    info:
      path: Apps/KITTPhone/Info.plist
      properties:
        CFBundleDisplayName: KITT
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.palvaran.kitt
        PRODUCT_NAME: KITT
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

schemes:
  KITTPhone:                       # run this on the iPhone (USB) to put KITT on the watch
    build:
      targets:
        KITTPhone: all
    run:
      config: Release
  KITTWatch:
    build:
      targets:
        KITTWatch: all
    run:
      config: Release
    profile:
      config: Release
